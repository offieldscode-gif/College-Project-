<!DOCTYPE html>
<html>
<head>
<title>Branches</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
    radial-gradient(circle at 20% 10%,#123b5c55,transparent 35%),
    #06101d;
    font-family:Arial,sans-serif;
    color:white;
    padding:20px 15px;
}

.title{
    padding:16px;
    border-radius:18px;
    background:#102033;
    border:1px solid #1d405d;
    margin-bottom:18px;
}

.title small{
    color:#00d9ff;
    letter-spacing:2px;
}

.title h2{
    margin:7px 0 0;
    font-size:20px;
}

.branch{
    display:block;
    text-decoration:none;
    color:white;
    padding:14px;
    margin:10px 0;
    border-radius:15px;
    background:#0d1b2c;
    border:1px solid #1d344b;
    transition:.3s;
}

.branch:hover{
    transform:translateX(6px);
    border-color:#00d9ff;
    background:#102c42;
    box-shadow:0 0 20px #00d9ff22;
}

.icon{
    display:inline-flex;
    width:35px;
    height:35px;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:#162e45;
    margin-right:8px;
}

.name{
    font-size:12px;
    font-weight:bold;
}

.code{
    display:block;
    color:#7895ae;
    font-size:9px;
    margin-left:44px;
    margin-top:-5px;
}
</style>
</head>

<body>

<div class="title">
    <small>ACADEMIC</small>
    <h2>Branches</h2>
</div>

</a>
