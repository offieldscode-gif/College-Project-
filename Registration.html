<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>College Portal - Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    padding:40px 15px;
    font-family:Arial, sans-serif;
    background:#070b16;
    color:white;
}

/* BACKGROUND */

.bg{
    position:fixed;
    inset:0;
    z-index:-2;

    background:
    radial-gradient(circle at 15% 15%, #4b35ff45, transparent 35%),
    radial-gradient(circle at 85% 85%, #00c8ff35, transparent 35%);
}

.grid{
    position:fixed;
    inset:0;
    z-index:-1;

    background-image:
    linear-gradient(#ffffff08 1px, transparent 1px),
    linear-gradient(90deg,#ffffff08 1px,transparent 1px);

    background-size:45px 45px;
}


/* MAIN CARD */

.container{
    width:700px;
    max-width:100%;
    margin:auto;

    padding:40px;

    border-radius:30px;

    background:rgba(255,255,255,.065);

    border:1px solid rgba(255,255,255,.16);

    backdrop-filter:blur(25px);

    box-shadow:0 25px 80px #00000080;
}


/* LOGO */

.logo{
    width:75px;
    height:75px;

    margin:0 auto 18px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:22px;

    font-size:35px;

    background:linear-gradient(
        135deg,
        #6655ff,
        #00c8ff
    );

    box-shadow:0 0 35px #6655ff55;
}


/* TITLE */

h1{
    text-align:center;
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#9da7bb;
    font-size:14px;
    margin-bottom:35px;
}


/* FORM */

.form-group{
    margin-bottom:22px;
}

.form-group > label{
    display:block;
    margin-bottom:9px;

    font-size:14px;
    color:#cbd2df;
}


/* INPUT */

.input-box{
    position:relative;
}

.input-icon{
    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    font-size:17px;

    pointer-events:none;
}

input[type="text"],
input[type="email"],
input[type="password"],
input[type="tel"]{

    width:100%;
    height:52px;

    padding:0 45px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.14);

    outline:none;

    background:rgba(0,0,0,.30);

    color:white;

    font-size:15px;
}

input:focus,
textarea:focus,
select:focus{

    border-color:#7568ff;

    box-shadow:
    0 0 0 3px #7568ff20,
    0 0 25px #7568ff20;
}

input::placeholder,
textarea::placeholder{
    color:#70798c;
}


/* PASSWORD EYE */

.eye{
    position:absolute;

    right:15px;
    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    font-size:18px;

    z-index:5;
}


/* SEX */

.radio-box{

    display:flex;
    gap:25px;
    flex-wrap:wrap;

    padding:15px;

    border-radius:14px;

    background:rgba(0,0,0,.25);

    border:1px solid rgba(255,255,255,.12);
}

.radio-item{

    display:flex;
    align-items:center;

    gap:8px;

    color:#cbd2df;

    cursor:pointer;
}

.radio-item input{
    width:16px;
    height:16px;
    accent-color:#7568ff;
}


/* DOB */

.dob-box{

    display:grid;

    grid-template-columns:1fr 1.5fr 1.2fr;

    gap:12px;
}

select{

    width:100%;
    height:52px;

    padding:0 14px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.14);

    outline:none;

    background:#11172a;

    color:white;

    font-size:14px;

    cursor:pointer;
}


/* =========================
   LANGUAGES
========================= */

.language-box{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;

    padding:18px;

    border-radius:14px;

    background:rgba(0,0,0,.25);

    border:1px solid rgba(255,255,255,.12);
}

.language-item{

    display:flex;

    align-items:center;

    gap:10px;

    color:#cbd2df;

    font-size:15px;

    cursor:pointer;

    padding:8px;

    border-radius:8px;

    transition:.2s;
}

.language-item:hover{
    background:rgba(117,104,255,.10);
}

.language-item input{

    width:17px;
    height:17px;

    accent-color:#7568ff;

    cursor:pointer;
}


/* =========================
   ADDRESS
========================= */

textarea{

    display:block;

    width:100%;

    height:140px;

    padding:15px;

    resize:vertical;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.14);

    outline:none;

    background:rgba(0,0,0,.30);

    color:white;

    font-family:Arial, sans-serif;

    font-size:15px;

    line-height:1.5;
}


/* BUTTONS */

.button-row{

    display:flex;

    gap:14px;

    margin-top:28px;
}

button{

    flex:1;

    height:52px;

    border-radius:14px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

.register-btn{

    border:none;

    color:white;

    background:linear-gradient(
        90deg,
        #6655ff,
        #00aeea
    );

    box-shadow:0 10px 30px #465aff35;
}

.reset-btn{

    color:white;

    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.15);
}

button:hover{
    transform:translateY(-2px);
}


/* MESSAGE */

#message{

    text-align:center;

    min-height:20px;

    margin-top:18px;

    font-size:14px;
}


/* LOGIN */

.login-link{

    text-align:center;

    margin-top:25px;

    color:#8994aa;

    font-size:14px;
}

.login-link a{

    color:#8d81ff;

    text-decoration:none;

    font-weight:bold;
}


/* FOOTER */

.footer{

    text-align:center;

    margin-top:25px;

    color:#70798d;

    font-size:12px;
}

.footer span{
    color:#8d81ff;
}


/* MOBILE */

@media(max-width:600px){

    body{
        padding:20px 10px;
    }

    .container{
        padding:30px 20px;
    }

    h1{
        font-size:27px;
    }

    .dob-box{
        grid-template-columns:1fr;
    }

    .language-box{
        grid-template-columns:1fr;
    }

    .button-row{
        flex-direction:column;
    }

}

</style>
</head>


<body>

<div class="bg"></div>
<div class="grid"></div>


<div class="container">

    <!-- LOGO -->

    <div class="logo">
        🎓
    </div>


    <h1>
        Create Account
    </h1>

    <p class="subtitle">
        Register for your College Portal
    </p>


    <!-- 1 NAME -->

    <div class="form-group">

        <label>1. Name</label>

        <div class="input-box">

            <span class="input-icon">👤</span>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
            >

        </div>

    </div>


    <!-- 2 PASSWORD -->

    <div class="form-group">

        <label>2. Password</label>

        <div class="input-box">

            <span class="input-icon">🔐</span>

            <input
                type="password"
                id="password"
                placeholder="Create your password"
            >

            <span
                class="eye"
                id="eye"
                onclick="togglePassword()"
            >👁️</span>

        </div>

    </div>


    <!-- 3 EMAIL -->

    <div class="form-group">

        <label>3. E-mail ID</label>

        <div class="input-box">

            <span class="input-icon">✉️</span>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

        </div>

    </div>


    <!-- 4 PHONE -->

    <div class="form-group">

        <label>4. Phone Number</label>

        <div class="input-box">

            <span class="input-icon">📱</span>

            <input
                type="tel"
                id="phone"
                maxlength="10"
                placeholder="Enter 10 digit phone number"
            >

        </div>

    </div>


    <!-- 5 SEX -->

    <div class="form-group">

        <label>5. Sex</label>

        <div class="radio-box">

            <label class="radio-item">
                <input type="radio" name="sex" value="Male">
                Male
            </label>

            <label class="radio-item">
                <input type="radio" name="sex" value="Female">
                Female
            </label>

            <label class="radio-item">
                <input type="radio" name="sex" value="Other">
                Other
            </label>

        </div>

    </div>


    <!-- 6 DOB -->

    <div class="form-group">

        <label>6. Date of Birth</label>

        <div class="dob-box">

            <select id="day">

                <option value="">Day</option>

                <script>

                    for(let i=1;i<=31;i++){

                        document.write(
                            "<option>"+i+"</option>"
                        );

                    }

                </script>

            </select>


            <select id="month">

                <option value="">Month</option>

                <option>January</option>
                <option>February</option>
                <option>March</option>
                <option>April</option>
                <option>May</option>
                <option>June</option>
                <option>July</option>
                <option>August</option>
                <option>September</option>
                <option>October</option>
                <option>November</option>
                <option>December</option>

            </select>


            <select id="year">

                <option value="">Year</option>

                <script>

                    for(let y=2026;y>=1980;y--){

                        document.write(
                            "<option>"+y+"</option>"
                        );

                    }

                </script>

            </select>

        </div>

    </div>


    <!-- 7 LANGUAGES -->

    <div class="form-group">

        <label>7. Languages Known</label>

        <div class="language-box">

            <label class="language-item">

                <input
                    type="checkbox"
                    name="language"
                    value="English"
                >

                <span>English</span>

            </label>


            <label class="language-item">

                <input
                    type="checkbox"
                    name="language"
                    value="Telugu"
                >

                <span>Telugu</span>

            </label>


            <label class="language-item">

                <input
                    type="checkbox"
                    name="language"
                    value="Hindi"
                >

                <span>Hindi</span>

            </label>


            <label class="language-item">

                <input
                    type="checkbox"
                    name="language"
                    value="Tamil"
                >

                <span>Tamil</span>

            </label>

        </div>

    </div>


    <!-- 8 ADDRESS -->

    <div class="form-group">

        <label>8. Address</label>

        <textarea
            id="address"
            placeholder="Enter your complete address here..."
        ></textarea>

    </div>


    <!-- BUTTONS -->

    <div class="button-row">

        <button
            type="button"
            class="register-btn"
            onclick="registerUser()"
        >
            REGISTER →
        </button>

        <button
            type="reset"
            class="reset-btn"
        >
            RESET
        </button>

    </div>


    <div id="message"></div>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


    <div class="footer">

        © 2026
        <span>College Portal</span>
        • All Rights Reserved

    </div>

</div>


<script>

/* PASSWORD SHOW / HIDE */

function togglePassword(){

    let password =
        document.getElementById("password");

    let eye =
        document.getElementById("eye");

    if(password.type === "password"){

        password.type = "text";

        eye.innerHTML = "🙈";

    }
    else{

        password.type = "password";

        eye.innerHTML = "👁️";

    }

}


/* PHONE ONLY NUMBERS */

document
.getElementById("phone")
.addEventListener("input",function(){

    this.value =
    this.value.replace(/[^0-9]/g,"");

});


/* REGISTER */

function registerUser(){

    let name =
        document.getElementById("name").value.trim();

    let password =
        document.getElementById("password").value.trim();

    let email =
        document.getElementById("email").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    let sex =
        document.querySelector(
            'input[name="sex"]:checked'
        );

    let day =
        document.getElementById("day").value;

    let month =
        document.getElementById("month").value;

    let year =
        document.getElementById("year").value;

    let address =
        document.getElementById("address").value.trim();

    let languages =
        document.querySelectorAll(
            'input[name="language"]:checked'
        );

    let message =
        document.getElementById("message");


    /* CHECK ALL FIELDS */

    if(
        name === "" ||
        password === "" ||
        email === "" ||
        phone === "" ||
        !sex ||
        day === "" ||
        month === "" ||
        year === "" ||
        languages.length === 0 ||
        address === ""
    ){

        message.style.color="#ff7898";

        message.innerHTML =
        "⚠ Please fill all fields.";

        return;
    }


    if(phone.length !== 10){

        message.style.color="#ff7898";

        message.innerHTML =
        "⚠ Phone number must contain 10 digits.";

        return;
    }


    message.style.color="#55f5b0";

    message.innerHTML =
    "✓ Registration Successful!";

}

</script>

</body>
</html>
